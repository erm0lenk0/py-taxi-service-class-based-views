{% extends "base.html" %}

{% block content %}
  <h1>Car List</h1>
  {% for car in car_list %}
    <li>
      <a href="{{ car.get_absolute_url }}">
      {{ car.model }} ({{ car.manufacturer.name }})</a>
      <br>
      <strong>Drivers:</strong>
      {{ car.drivers.all|join:", " }}
    </li>
  {% endfor %}
{% endblock %}
